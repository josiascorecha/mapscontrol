# Nginx no host (se a inspeção mostrar Nginx já em uso).
# 1) Copie para /etc/nginx/sites-available/mapscontrol e crie o link em sites-enabled.
# 2) nginx -t && systemctl reload nginx
# 3) certbot --nginx -d mapscontrol.j2bot.com.br   (emite o certificado só deste subdomínio)
server {
    listen 80;
    server_name mapscontrol.j2bot.com.br;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
